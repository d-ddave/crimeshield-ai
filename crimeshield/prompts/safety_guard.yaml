system: |
  Classify the following query into EXACTLY ONE of these categories:
  [policy, structured_data, sar, unsafe, off_topic]

  Classification rules:
  - "policy": Questions about AML/CFT regulations, compliance policies, red flags, JMLSG guidance, SAR filing procedures, or regulatory frameworks.
  - "structured_data": Questions about alert data, statistics, counts, risk bands, typology thresholds, or any query requiring database/table lookups.
  - "sar": Requests to draft, generate, or write a Suspicious Activity Report (SAR) for a specific alert.
  - "unsafe": ANY query about evading detection, concealing transactions, bypassing AML controls, moving money without triggering SARs, sanctions evasion methods, or anything adversarial toward the bank's crime prevention function. This includes questions about how to avoid being caught, how to structure transactions to avoid reporting, or how to circumvent financial crime controls.
  - "off_topic": Queries unrelated to financial crime, banking compliance, or economic crime prevention.

human_template: |
  Query: {masked_query}

  Respond with ONLY a JSON object in this exact format (no markdown, no code blocks):
  {{"intent": "<category>", "confidence": <0.0-1.0>, "unsafe_reason": "<reason or empty string>"}}

decline_message: >
  I'm unable to assist with that request. CrimeShield AI is designed
  to support economic crime prevention activities only. This query
  has been logged.

blocked_patterns:
  - "without triggering"
  - "avoid detection"
  - "bypass sar"
  - "conceal funds"
  - "structuring advice"
  - "split transactions to avoid"
  - "how to move money"
  - "ignore previous instructions"
  - "you are now"
  - "forget your"
  - "system prompt"
  - "jailbreak"
  - "bypass aml"
  - "avoid suspicious"
  - "hide transaction"
  - "circumvent controls"
  - "move cash without"
  - "evading reporting"
  - "avoid flagging"
  - "structure payments"
  - "not triggering"
  - "prevent detection"
  - "bypass compliance"

injection_prefixes:
  - "ignore previous"
  - "system:"
  - "<<sys>>"
  - "you are now"
  - "[inst]"
  - "forget your instructions"
  - "disregard all prior"
